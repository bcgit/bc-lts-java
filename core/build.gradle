import static ExtraFunctions.copyDirContent
import static ExtraFunctions.directoryExists

plugins {
    id "biz.aQute.bnd.builder" version "7.0.0"
}


def arch_ = System.getProperty("os.arch", "").toLowerCase();
def appendix = ""

def ignoreJava = "sha512,sha384,sha256,sha224,sha3,shake,gcm,cbc,ecb,rand,seed,cfb,ctr,es,slhdsa_sha256,ccm,gcmsiv" // mlkem
def igoreNeon = "rand,seed,es,gcmsiv,nops,slhdsa_sha256"
def ignoreIntel = ""

def testIgnore = ignoreJava;

if (arch_.contains("aarch64") || (arch_.contains("arm64"))) {
    appendix = "arm64"
    testIgnore = igoreNeon
} else if ((arch_.contains("x86") || (arch_.contains("amd")) && arch_.contains("64"))) {
    appendix = "amd64"
    testIgnore = ignoreIntel
}

jar.archiveBaseName = "bccore-lts$vm_range"





sourceSets {
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9']
        }
    }
}


dependencies {
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.13.3'

    java9Implementation files([sourceSets.main.output.classesDirs]) {
        builtBy compileJava
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    // Source: https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    testImplementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly(files(jar.archiveFile))

}


jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }

    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

compileJava {
    options.release = 8
}


task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    exclude("**/*.so")
    into('native/intel') {
        from '../native_c/intel'
    }
    into('native/jniutil') {
        from '../native_c/jniutil'
    }
}

javadoc {
    title = "Bouncy Castle Library (LTS Edition) ${version} Low-Level API"
    options.windowTitle = "Bouncy Castle Library (LTS Edition) ${version} Low-Level API"
    options.overview = "overview.html"
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}


compileJava9Java {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(11)
    }
    options.release = 9
    options.sourcepath = files(['src/main/java', 'src/main/jdk1.9'])
}


task cleanNative(type: Delete) {
    delete("$projectDir/src/main/resources/native/");
    delete("$projectDir/src/main/resources/META-INF/DRIVERS");
}


task('copyJars', type: Copy) {
    dependsOn("jar")
    dependsOn("sourcesJar")
    dependsOn("javadocJar")

    from new File(projectDir, "build/libs")
    into new File(rootDir, "../bc-lts-java-jars/${version}/")
}

task withNative() {
    doLast {

        // Intel -- Linux
        if (directoryExists("$rootDir/native_c/target/linux/x86_64/probe")) {
            copyDirContent("$rootDir/native_c/target/linux/x86_64/probe", "$projectDir/src/main/resources/native/linux/x86_64/probe")
        }

        if (directoryExists("$rootDir/native_c/target/linux/x86_64/sse")) {
            copyDirContent("$rootDir/native_c/target/linux/x86_64/sse", "$projectDir/src/main/resources/native/linux/x86_64/sse")
        }

        if (directoryExists("$rootDir/native_c/target/linux/x86_64/avx")) {
            copyDirContent("$rootDir/native_c/target/linux/x86_64/avx", "$projectDir/src/main/resources/native/linux/x86_64/avx")
        }

        if (directoryExists("$rootDir/native_c/target/linux/x86_64/vaes")) {
            copyDirContent("$rootDir/native_c/target/linux/x86_64/vaes", "$projectDir/src/main/resources/native/linux/x86_64/vaes")
        }

        if (directoryExists("$rootDir/native_c/target/linux/x86_64/vaesf")) {
            copyDirContent("$rootDir/native_c/target/linux/x86_64/vaesf", "$projectDir/src/main/resources/native/linux/x86_64/vaesf")
        }

        // ARM - darwin
        if (directoryExists("$rootDir/native_c/target/darwin/arm64/probe")) {
            copyDirContent("$rootDir/native_c/target/darwin/arm64/probe", "$projectDir/src/main/resources/native/darwin/arm64/probe")
        }

        if (directoryExists("$rootDir/native_c/target/darwin/arm64/neon-le")) {
            copyDirContent("$rootDir/native_c/target/darwin/arm64/neon-le", "$projectDir/src/main/resources/native/darwin/arm64/neon-le")
        }

        // ARM - linux
        if (directoryExists("$rootDir/native_c/target/linux/arm64/probe")) {
            copyDirContent("$rootDir/native_c/target/linux/arm64/probe", "$projectDir/src/main/resources/native/linux/arm64/probe")
        }

        if (directoryExists("$rootDir/native_c/target/linux/arm64/neon-le")) {
            copyDirContent("$rootDir/native_c/target/linux/arm64/neon-le", "$projectDir/src/main/resources/native/linux/arm64/neon-le")
        }


    }
}


//
// Unit tests run in parallel
//
def registerUnitTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String expectedJvm, String variant, String interfaceType = "any", String ignore = "") {

    taskContainer.register("${taskName}Unit", Test) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = Math.min(1, Runtime.getRuntime().availableProcessors() - 1);
        forkEvery = 1

        filter {
            excludeTestsMatching "*AllIntegrationTest*"
            includeTestsMatching "*AllTest*"
        }

        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        jvmArgs "-Dtest.bclts.ignore.native=${ignore}", "-Dtest.bclts.expected_jvm=${expectedJvm}", "-Dorg.bouncycastle.native.loader.type=${interfaceType}", "-Dorg.bouncycastle.native.cpu_variant=${variant}"
    }

}

//
// These test tasks serially one jvm per test
//
def registerIntegrationTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String expectedJvm, String variant, String interfaceType = "any", String ignore) {

    taskContainer.register("${taskName}Integration", Test.class) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = 1;
        forkEvery = 1;

        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        filter {
            excludeTestsMatching "*AllTest*"
            includeTestsMatching "*AllIntegrationTest*"
        }


        jvmArgs "-Dtest.bclts.ignore.native=${ignore}", "-Dtest.bclts.expected_jvm=${expectedJvm}", "-Dorg.bouncycastle.native.loader.type=${interfaceType}", "-Dorg.bouncycastle.native.cpu_variant=${variant}"
    }

}


test {

    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    failOnNoDiscoveredTests = true
    useJUnitPlatform()

    maxParallelForks = 1;
    forkEvery = 1

    minHeapSize = "4096m"
    maxHeapSize = "8192m"

    filter {
        includeTestsMatching "*AllTest*"
        includeTestsMatching "*AllIntegrationTests*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")
    args.add('-Dtest.bclts.expected_jvm=any')
    args.add("-Dtest.bclts.ignore.native=${testIgnore}") // testIgnore is determined by platform architecture
//    args.add('-Dorg.bouncycastle.native.cpu_variant=java')

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    jvmArgs args

}


