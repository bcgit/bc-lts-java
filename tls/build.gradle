plugins {
    id "biz.aQute.bnd.builder" version "7.0.0"
}

apply plugin: 'maven-publish'

jar.archiveBaseName = "bctls-lts$vm_range"

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/jdk1.5']
        }
    }
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9']
        }
    }

    // src/main/jdk25 belonged to no source set, so its three classes were compiled nowhere and
    // the jar shipped no META-INF/versions/25 at all - on JDK 25 the versions/9 SSLSession
    // classes were used, which do not implement the RFC 5705 exportKeyingMaterial* methods.
    java25 {
        java {
            srcDirs = ['src/main/jdk25']
        }
    }

    // src/test/jdk25 previously belonged to no source set, so nothing in it was compiled or run.
    test25 {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += test.output
            srcDir(files("src/test/jdk25"))
        }
    }
}

dependencies {
    implementation project(':prov')
    implementation project(':util')

    implementation files("$lts_prov")
    implementation files("$lts_util")
    implementation project(path: ':core')
    testImplementation project(':pkix')


    java9Implementation files("$lts_prov")
    java9Implementation files("$lts_util")
    java9Implementation files(sourceSets.main.output.classesDirs) {
        builtBy compileJava
    }

    java25Implementation files([sourceSets.main.output.classesDirs, sourceSets.java9.output.classesDirs]) {
        builtBy compileJava9Java
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    // Source: https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    testImplementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly(files(jar.archiveFile))

    // deliberately NOT the tls project itself: the jar supplies its classes, so the
    // META-INF/versions overlays are the ones loaded. See the testMR task.
    test25Implementation project(':prov')
    test25Implementation project(':util')
    test25Implementation project(':core')
    test25Implementation project(':pkix')
    test25Implementation 'junit:junit:4.13.2'
    test25Implementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    test25RuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    test25Implementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    test25RuntimeOnly("org.junit.platform:junit-platform-launcher")
}

compileTest25Java {
    // release 21, not 25: nothing under src/test/jdk25 uses a JDK 25 API - the JDK-25 part is the
    // runtime - and compiling at 21 lets these classes build and run wherever the toolchain is 21+.
    options.release = 21
    options.sourcepath = files(['src/test/java', 'src/test/jdk25'])
}

compileJava {
    options.release = 8
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

compileJava25Java {
    // Needs a real JDK 25: exportKeyingMaterialData/Key are JDK 25 platform API, so the JDK 21
    // symbol set cannot see them. Resolved through org.gradle.java.installations.fromEnv, so
    // JAVA_HOME stays on 21 and only LTS_JDK25 has to point at a 25.
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(25)
    }
    options.release = 25
    options.sourcepath = files(['src/main/java', 'src/main/jdk25'])
}

compileJava9Java {
    options.release = 9

    options.compilerArgs += [
            '--module-path', "$lts_prov:$lts_util"
    ]
    options.sourcepath = files(['src/main/jdk1.5', 'src/main/java', 'src/main/jdk1.9'])
    options.compilerArgs << '-implicit:none'  // avoid recompiling every baseline class implicitly loaded via sourcepath

    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    into('META-INF/versions/25') {
        from sourceSets.java25.output
    }
    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bctls')
    manifest.attributes('Bundle-SymbolicName': 'bctls')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "org.bouncycastle.{jsse|tls}.*;version=${v}")
    manifest.attributes('Import-Package': "java.*;resolution:=optional,javax.*;resolution:=optional,!org.bouncycastle.{jsse|tls}.*,org.bouncycastle.*;version=\"[${v},${maxVersion})\"")
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
    into('META-INF/versions/25') {
        from sourceSets.java25.allSource
    }
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

javadoc {
    title = "Bouncy Castle Library (LTS Edition) ${version} TLS API"
    options.windowTitle = "Bouncy Castle Library (LTS Edition) ${version} TLS API"
    options.overview = "overview.html"
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bctls-lts$vm_range"
            from components.java

            artifact(javadocJar)
            artifact(sourcesJar)
        }

    }
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

task('copyJars', type: Copy) {
    dependsOn("jar")
    dependsOn("sourcesJar")
    dependsOn("javadocJar")

    from new File(projectDir, "build/libs")
    into new File(rootDir, "../bc-lts-java-jars/${version}/")
}

checkstyleMain {
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

compileTestJava {
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}


//
// How many test classes share one JVM. Several test classes call System.setProperty, and the
// loaded native variant is process-global, so the isolation matters.
ext.forkEveryClasses = Math.min(1, Runtime.getRuntime().availableProcessors() - 1)

def registerTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String security = null) {

    taskContainer.register("${taskName}Integration", Test) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = 1;
        forkEvery = forkEveryClasses

        filter {
            includeTestsMatching "*AllTest*"
        }

        def args = new ArrayList<String>();
        args.add("-Dtest.bclts.expected_jvm=any")
        args.add("-Dorg.bouncycastle.bks.enable_v1=true")


        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        if (security != null) {
            args.add("-Djava.security.properties==${projectDir}/${security}")
        }

        jvmArgs args
    }

}


test {


    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true


    failOnNoDiscoveredTests = true
    useJUnitPlatform()


    maxParallelForks = Math.max(1, Runtime.getRuntime().availableProcessors() - 1);
    forkEvery = forkEveryClasses

    minHeapSize = "512m"
    maxHeapSize = "4096m"

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    // Schedule the individual test classes, not the two AllTests aggregates.
    //
    // maxParallelForks spreads the classes gradle SCHEDULES. Selecting "*AllTest*" schedules two
    // units here, each of which then runs its ~25 contained classes in-process and serially, so
    // the fork count had nothing to spread and raising it changed nothing (measured: 6m52s at one
    // fork, 6m56s at nineteen). Excluding the aggregates puts every class on the queue instead.
    //
    // Safe in this module because both tls AllTests wrappers have an empty setUp/tearDown, so a
    // class run on its own gets what it got inside the suite. That is NOT true of prov, pkix, pg
    // or mail, whose suites register providers in setUp - do not copy this filter there without
    // dealing with that first.
    filter {
        excludeTestsMatching "*AllTest*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")

    String ver = System.getProperty("java.version")
    if (ver.startsWith("1.8")) {
        args.add("-Djava.security.properties=${projectDir}/jdk8.java.security")
    } else if (ver.startsWith("21")) {
        args.add("-Djava.security.properties=${projectDir}/jdk21.java.security")
    } else if (ver.startsWith("25")) {
        args.add("-Djava.security.properties=${projectDir}/jdk25.java.security")
    }

    jvmArgs args
}

tasks.register("testMultiJVM") {
    dependsOn("test8Integration")
    dependsOn("test21Integration")
}

/**
 * The multi-release pairing test. Its classpath deliberately carries the bctls JAR and NOT this
 * project's main classes directories, so the root ProvSSLContextSpi is paired with the
 * META-INF/versions/9 SSLEngineUtil exactly as it is in a deployment. Run from the classes
 * directories the overlay is never consulted and the defect this guards (github #2448, a
 * NoSuchMethodError out of SSLContext.createSSLEngine) is invisible - which is why it needs a task
 * of its own rather than a place in the ordinary test suite.
 *
 * Version agnostic: it needs JDK 9+, not JDK 25, so it runs on the default toolchain.
 */
tasks.register("testMR", Test) {
    dependsOn jar

    useJUnitPlatform()
    failOnNoDiscoveredTests = true

    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    maxParallelForks = 1
    forkEvery = 1

    testClassesDirs = project.sourceSets.test25.output.classesDirs
    classpath = project.sourceSets.test25.runtimeClasspath + files(jar.archiveFile)

    filter {
        includeTestsMatching "org.bouncycastle.jsse.provider.test.AllTests25"
    }
}

// so an ordinary build runs it
check.dependsOn("testMR")

/**
 * The JDK 25 interop tests under src/test/jdk25 - the JDK's own TLS stack is what makes them
 * interesting, so they need a 25 toolchain. Skipped when LTS_JDK25 is not set.
 */
tasks.register("test25", Test) {
    onlyIf { System.getenv("LTS_JDK25") != null }
    dependsOn jar

    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(25)
    }

    useJUnitPlatform()
    failOnNoDiscoveredTests = true

    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    maxParallelForks = 1
    forkEvery = 1

    testClassesDirs = project.sourceSets.test25.output.classesDirs
    classpath = project.sourceSets.test25.runtimeClasspath + files(jar.archiveFile)

    filter {
        includeTestsMatching "*AllTest*"
    }

    jvmArgs "-Djava.security.properties=${projectDir}/jdk25.java.security"
}

registerTestTask(tasks, "test8", "LTS_JDK8", 8, "jdk8.java.security")
registerTestTask(tasks, "test21", "LTS_JDK21", 21, "jdk21.java.security")


tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
