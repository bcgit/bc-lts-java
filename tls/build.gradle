plugins {
    id "biz.aQute.bnd.builder" version "7.0.0"
}

apply plugin: 'maven-publish'

jar.archiveBaseName = "bctls-lts$vm_range"

sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', 'src/main/jdk1.5']
        }
    }
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9']
        }
    }
}

dependencies {
    implementation project(':prov')
    implementation project(':util')

    implementation files("$lts_prov")
    implementation files("$lts_util")
    implementation project(path: ':core')
    testImplementation project(':pkix')


    java9Implementation files("$lts_prov")
    java9Implementation files("$lts_util")
    java9Implementation files(sourceSets.main.output.classesDirs) {
        builtBy compileJava
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    // Source: https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    testImplementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly(files(jar.archiveFile))

}

compileJava {
    options.release = 8
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

compileJava9Java {
    options.release = 9

    options.compilerArgs += [
            '--module-path', "$lts_prov:$lts_util"
    ]
    options.sourcepath = files(['src/main/jdk1.5', 'src/main/java', 'src/main/jdk1.9'])

    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bctls')
    manifest.attributes('Bundle-SymbolicName': 'bctls')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "org.bouncycastle.{jsse|tls}.*;version=${v}")
    manifest.attributes('Import-Package': "java.*;resolution:=optional,javax.*;resolution:=optional,!org.bouncycastle.{jsse|tls}.*,org.bouncycastle.*;version=\"[${v},${maxVersion})\"")
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

javadoc {
    title = "Bouncy Castle Library (LTS Edition) ${version} TLS API"
    options.windowTitle = "Bouncy Castle Library (LTS Edition) ${version} TLS API"
    options.overview = "overview.html"
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bctls-lts$vm_range"
            from components.java

            artifact(javadocJar)
            artifact(sourcesJar)
        }

    }
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

task('copyJars', type: Copy) {
    dependsOn("jar")
    dependsOn("sourcesJar")
    dependsOn("javadocJar")

    from new File(projectDir, "build/libs")
    into new File(rootDir, "../bc-lts-java-jars/${version}/")
}

checkstyleMain {
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}

compileTestJava {
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
}


def registerTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String security = null) {

    taskContainer.register("${taskName}Integration", Test) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        systemProperty 'bc.test.data.home', bcTestDataHome
        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = 1;
        forkEvery = 1

        filter {
            includeTestsMatching "*AllTest*"
        }

        def args = new ArrayList<String>();
        args.add("-Dtest.bclts.expected_jvm=any")
        args.add("-Dorg.bouncycastle.bks.enable_v1=true")


        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        if (security != null) {
            args.add("-Djava.security.properties==${projectDir}/${security}")
        }

        jvmArgs args
    }

}


test {


    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true


    failOnNoDiscoveredTests = true
    useJUnitPlatform()


    maxParallelForks = 1;
    forkEvery = 1

    minHeapSize = "4096m"
    maxHeapSize = "8192m"

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    filter {
        includeTestsMatching "*AllTest*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")

    String ver = System.getProperty("java.version")
    if (ver.startsWith("1.8")) {
        args.add("-Djava.security.properties=${projectDir}/jdk8.java.security")
    } else if (ver.startsWith("21")) {
        args.add("-Djava.security.properties=${projectDir}/jdk21.java.security")
    } else if (ver.startsWith("25")) {
        args.add("-Djava.security.properties=${projectDir}/jdk25.java.security")
    }

    jvmArgs args
}

tasks.register("testMultiJVM") {
    dependsOn("test8Integration")
    dependsOn("test21Integration")
}

registerTestTask(tasks, "test8", "LTS_JDK8", 8, "jdk8.java.security")
registerTestTask(tasks, "test21", "LTS_JDK21", 21, "jdk21.java.security")


tasks.withType(Test).configureEach {
    failOnNoDiscoveredTests = false
}
