plugins {
    id "biz.aQute.bnd.builder" version "7.0.0"
}

apply plugin: 'maven-publish'

jar.archiveBaseName = "bcprov${rootProject.ext.debugSuffix}lts${vm_range}"


def arch_ = System.getProperty("os.arch", "").toLowerCase();
def appendix = ""


def ignoreJava = "sha512,sha384,sha256,sha224,sha3,shake,gcm,cbc,ecb,rand,seed,cfb,ctr,es,slhdsa_sha256,ccm,gcmsiv" // mlkem
def igoreNeon = "rand,seed,es,gcmsiv,nops,slhdsa_sha256"
def ignoreIntel = "sha512,sha384,shake,sha3"

def testIgnore = ignoreJava;

if (arch_.contains("aarch64") || (arch_.contains("arm64"))) {
    appendix = "arm64"
    testIgnore = igoreNeon
} else if ((arch_.contains("x86") || (arch_.contains("amd")) && arch_.contains("64"))) {
    appendix = "amd64"
    testIgnore = ignoreIntel
}


sourceSets {
    main {
        java {
            srcDirs '../core/src/main/java'
        }
        resources {
            srcDirs '../core/src/main/resources'
        }
    }
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9', '../core/src/main/jdk1.9/org']
        }
    }
    java11 {
        java {
            srcDirs = ['src/main/jdk1.11']
        }
    }
    java15 {
        java {
            srcDirs = ['src/main/jdk1.15']
        }
    }
    java17 {
        java {
            srcDirs = ['src/main/jdk17']
        }
    }
}

dependencies {
    implementation project(path: ':core')
    java9Implementation files([sourceSets.main.output.classesDirs]) {
        builtBy compileJava
    }

    java11Implementation files([sourceSets.main.output.classesDirs, sourceSets.java9.output.classesDirs]) {
        builtBy compileJava9Java
    }

    java15Implementation files([sourceSets.main.output.classesDirs, sourceSets.java9.output.classesDirs, sourceSets.java11.output.classesDirs]) {
        builtBy compileJava11Java
    }

    java17Implementation files([sourceSets.main.output.classesDirs, sourceSets.java9.output.classesDirs, sourceSets.java11.output.classesDirs, sourceSets.java15.output.classesDirs]) {
        builtBy compileJava15Java
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    // Source: https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    testImplementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly(files(jar.archiveFile))

}

compileJava {
    options.release = 8
    options.debug = rootProject.ext.debugBuild
}

compileJava9Java {
    options.release = 9
    options.debug = rootProject.ext.debugBuild
    options.sourcepath = files(['../core/src/main/java', 'src/main/java', 'src/main/jdk1.9', '../core/src/main/jdk1.9/org'])
}

compileJava11Java {
    options.release = 11
    options.debug = rootProject.ext.debugBuild
}

compileJava15Java {
    options.release = 15
    options.debug = rootProject.ext.debugBuild
}

compileJava17Java {
    // Use -source/-target 17 rather than --release 17 so the JDK 17 multi-release
    // sources compile against the full running-JDK (21) platform API. This exposes
    // javax.crypto.KEM (JEP 452, added in JDK 21 and backported to Java 17 at
    // runtime) to the ML-KEM JCE SPIs, which --release 17 hides behind the JDK 17
    // symbol set. Bytecode is still emitted at the Java 17 level.
    sourceCompatibility = 17
    targetCompatibility = 17
    options.debug = rootProject.ext.debugBuild
}

compileTestJava {
    options.release = 8
    options.debug = true
}


jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    into('META-INF/versions/11') {
        from sourceSets.java11.output
    }
    into('META-INF/versions/15') {
        from sourceSets.java15.output
    }
    into('META-INF/versions/17') {
        from sourceSets.java17.output
    }

    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bcprov')
    manifest.attributes('Bundle-SymbolicName': 'bcprov')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "!org.bouncycastle.internal.*,org.bouncycastle.*;version=${v}")
    manifest.attributes('Import-Package': 'java.*;resolution:=optional,javax.*;resolution:=optional')
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    exclude("**/*.so")
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
    into('META-INF/versions/11') {
        from sourceSets.java11.allSource
    }
    into('META-INF/versions/15') {
        from sourceSets.java15.allSource
    }
    into('native/intel') {
        from '../native_c/intel'
    }
    into('native/jniutil') {
        from '../native_c/jniutil'
    }
}

task fullJavaDoc(type: Javadoc) {
    title = "Bouncy Castle Library (LTS Edition) ${version} Provider API"
    options.windowTitle = "Bouncy Castle Library (LTS Edition) ${version} Provider API"
    options.overview = "overview.html"
    source = files([sourceSets.main.allJava])
}

task javadocJar(type: Jar, dependsOn: fullJavaDoc) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

task('copyJars', type: Copy) {
    dependsOn("jar")
    dependsOn("sourcesJar")
    dependsOn("javadocJar")

    from new File(projectDir, "build/libs")
    into new File(rootDir, "../bc-lts-java-jars/${version}/")
}





publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bcprov-lts$vm_range"
            from components.java

            artifact(javadocJar)
            artifact(sourcesJar)
        }

    }
}





//
// Unit tests run in parallel
//
def registerUnitTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String expectedJvm, String variant, String interfaceType = "any", String ignore = "", boolean withPS = false) {

    taskContainer.register("${taskName}Unit", Test) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()

        systemProperty 'bc.test.data.home', bcTestDataHome

        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = Math.min(1, Runtime.getRuntime().availableProcessors() - 1);
        forkEvery = 8

        filter {
//            excludeTestsMatching "*LimitTest*"
//            excludeTestsMatching "*AgreementTest*"
//            excludeTestsMatching "*FailureTest*"
//            excludeTestsMatching "*PerformanceTest*"
            excludeTestsMatching "*AllIntegrationTest*"
            includeTestsMatching "*AllTest*"
        }

        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        def props = new ArrayList<String>();
        props.add("-Dtest.bclts.ignore.native=${ignore}")
        props.add("-Dtest.bclts.expected_jvm=${expectedJvm}")
        props.add("-Dorg.bouncycastle.native.loader.type=${interfaceType}")
        props.add("-Dorg.bouncycastle.native.cpu_variant=${variant}")
        props.add("-Dorg.bouncycastle.bks.enable_v1=true")

        if (!withPS) {
            props += "-Dorg.bouncycastle.test.skip_pc=true"
            props += "-Dorg.bouncycastle.packet_cipher_enabled=false"
        }

        jvmArgs props as List<String>

    }

}

//
// These test tasks serially one jvm per test
//
def registerIntegrationTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion, String expectedJvm, String variant, String interfaceType = "any", String ignore,boolean withPS = false) {

    taskContainer.register("${taskName}Integration", Test.class) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()

        systemProperty 'bc.test.data.home', bcTestDataHome
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = 1;
        forkEvery = 1;

        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        filter {
            excludeTestsMatching "*AllTest*"
            includeTestsMatching "*AllIntegrationTest*"
//            includeTestsMatching "*LimitTest*"
//            includeTestsMatching "*AgreementTest*"
//            includeTestsMatching "*FailureTest*"
        }


        def props = new ArrayList<String>();
        props.add("-Dtest.bclts.ignore.native=${ignore}")
        props.add("-Dtest.bclts.expected_jvm=${expectedJvm}")
        props.add("-Dorg.bouncycastle.native.loader.type=${interfaceType}")
        props.add("-Dorg.bouncycastle.native.cpu_variant=${variant}")
        props.add("-Dorg.bouncycastle.bks.enable_v1=true")

        if (!withPS) {
            props += "-Dorg.bouncycastle.test.skip_pc=true"
            props += "-Dorg.bouncycastle.packet_cipher_enabled=false"
        }

        jvmArgs props as List<String>


    }

}


test {

    dependsOn("testIntegration")

    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    failOnNoDiscoveredTests = true
    useJUnitPlatform()

    minHeapSize = "4096m"
    maxHeapSize = "8192m"

    maxParallelForks = Math.min(1, Runtime.getRuntime().availableProcessors() - 1);
    forkEvery = 1

    filter {
        includeTestsMatching "*AllTest*"
        excludeTestsMatching "*AllIntegrationTests*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")
    args.add('-Dtest.bclts.expected_jvm=any')
    args.add("-Dtest.bclts.ignore.native=${testIgnore}") // testIgnore is determined by platform architecture

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    jvmArgs args
}

//
// This test stanza exists because some of the integration tests use a lot of memory
//
tasks.register("testIntegration",Test) {
    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    failOnNoDiscoveredTests = true
    useJUnitPlatform()

    minHeapSize = "4096m"
    maxHeapSize = "8192m"

    maxParallelForks = 1
    forkEvery = 1

    filter {
        excludeTestsMatching "*AllTest*"
        includeTestsMatching "*AllIntegrationTests*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")
    args.add('-Dtest.bclts.expected_jvm=any')
    args.add("-Dtest.bclts.ignore.native=${testIgnore}") // testIgnore is determined by platform architecture

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    jvmArgs args
}




tasks.register("testMultiJVM") {
    dependsOn("test8Unit")
    dependsOn("test17Unit")
    dependsOn("test8Integration")
    dependsOn("test17Integration")
    dependsOn("testNative")
}


//
// Java only tests
//

registerUnitTestTask(tasks, "test8", "LTS_JDK8", 8, "1.8", "java", "auto", ignoreJava)
registerUnitTestTask(tasks, "test17", "LTS_JDK21", 17, "17", "java", "auto", ignoreJava)

registerIntegrationTestTask(tasks, "test8", "LTS_JDK8", 8, "1.8", "java", "auto", ignoreJava)
registerIntegrationTestTask(tasks, "test17", "LTS_JDK21", 17, "17", "java", "auto", ignoreJava)





if (arch_.contains("aarch64") || (arch_.contains("arm64"))) {

    System.out.println("Adding ARM tests");
    //
    // ARM
    //

    registerUnitTestTask(tasks, "testNEON8NoPS", "LTS_JDK8", 8, "1.8", "neon-le", "auto", igoreNeon)
    registerUnitTestTask(tasks, "testNEON21NoPS", "LTS_JDK21", 21, "21", "neon-le", "auto", igoreNeon)

    registerUnitTestTask(tasks, "testNEON8", "LTS_JDK8", 8, "1.8", "neon-le", "auto", igoreNeon,true)
    registerUnitTestTask(tasks, "testNEON21", "LTS_JDK21", 21, "21", "neon-le", "auto", igoreNeon,true)

    registerIntegrationTestTask(tasks, "testNEON8NoPS", "LTS_JDK8", 8, "1.8", "neon-le", "auto", igoreNeon)
    registerIntegrationTestTask(tasks, "testNEON21NoPS", "LTS_JDK21", 21, "21", "neon-le", "auto", igoreNeon)

    registerIntegrationTestTask(tasks, "testNEON8", "LTS_JDK8", 8, "1.8", "neon-le", "auto", igoreNeon,false)
    registerIntegrationTestTask(tasks, "testNEON21", "LTS_JDK21", 21, "21", "neon-le", "auto", igoreNeon,false)



    tasks.register("testVAESF") {
        // Does nothing on ARM platforms
        doLast() {
            println("testVAESF not available on this platform!");
        }
    }

    tasks.register("testVAES") {
        // Does nothing on ARM platforms
        doLast() {
            println("testVAES not available on this platform!");
        }
    }

    tasks.register("testAVX") {
        doLast() {
            println("testAVX not available on this platform!");
        }
        // Does nothing on ARM platforms
    }

    tasks.register("testNEON") {
        for (String name in tasks.findAll { it.name.contains("NEON") }) {
            String n = name.substring(name.lastIndexOf(':') + 1).replace("'", "");
            if (n.equals("testNEON")) {
                continue // break cyclic task dep
            }
            dependsOn(n);
        }
    }

    tasks.register("testNative") {
        dependsOn("testNEON");
    }

} else if ((arch_.contains("x86") || (arch_.contains("amd")) && arch_.contains("64"))) {

    System.out.println("Adding INTEL/AMD tests");

    //
    // INTEL AMD
    //

    registerUnitTestTask(tasks, "testAVX8NoPS", "LTS_JDK8", 8, "1.8", "avx", "auto", ignoreIntel)
    registerUnitTestTask(tasks, "testAVX21NoPS", "LTS_JDK21", 21, "21", "avx", "auto", ignoreIntel)

    registerUnitTestTask(tasks, "testVAES8NoPS", "LTS_JDK8", 8, "1.8", "vaes", "auto", ignoreIntel)
    registerUnitTestTask(tasks, "testVAES21NoPS", "LTS_JDK21", 21, "21", "vaes", "auto", ignoreIntel)

    registerUnitTestTask(tasks, "testVAESF8NoPS", "LTS_JDK8", 8, "1.8", "vaesf", "auto", ignoreIntel)
    registerUnitTestTask(tasks, "testVAESF21NoPS", "LTS_JDK21", 21, "21", "vaesf", "auto", ignoreIntel)


    registerUnitTestTask(tasks, "testAVX8", "LTS_JDK8", 8, "1.8", "avx", "auto", ignoreIntel,true)
    registerUnitTestTask(tasks, "testAVX21", "LTS_JDK21", 21, "21", "avx", "auto", ignoreIntel,true)

    registerUnitTestTask(tasks, "testVAES8", "LTS_JDK8", 8, "1.8", "vaes", "auto", ignoreIntel,true)
    registerUnitTestTask(tasks, "testVAES21", "LTS_JDK21", 21, "21", "vaes", "auto", ignoreIntel,true)

    registerUnitTestTask(tasks, "testVAESF8", "LTS_JDK8", 8, "1.8", "vaesf", "auto", ignoreIntel,true)
    registerUnitTestTask(tasks, "testVAESF21", "LTS_JDK21", 21, "21", "vaesf", "auto", ignoreIntel,true)



    // integration

    registerIntegrationTestTask(tasks, "testAVX8NoPS", "LTS_JDK8", 8, "1.8", "avx", "auto", ignoreIntel)
    registerIntegrationTestTask(tasks, "testAVX21NoPS", "LTS_JDK21", 21, "21", "avx", "auto", ignoreIntel)

    registerIntegrationTestTask(tasks, "testVAES8NoPS", "LTS_JDK8", 8, "1.8", "vaes", "auto", ignoreIntel)
    registerIntegrationTestTask(tasks, "testVAES21NoPS", "LTS_JDK21", 21, "21", "vaes", "auto", ignoreIntel)

    registerIntegrationTestTask(tasks, "testVAESF8NoPS", "LTS_JDK8", 8, "1.8", "vaesf", "auto", ignoreIntel)
    registerIntegrationTestTask(tasks, "testVAESF21NoPS", "LTS_JDK21", 21, "21", "vaesf", "auto", ignoreIntel)


    registerIntegrationTestTask(tasks, "testAVX8", "LTS_JDK8", 8, "1.8", "avx", "auto", ignoreIntel,true)
    registerIntegrationTestTask(tasks, "testAVX21", "LTS_JDK21", 21, "21", "avx", "auto", ignoreIntel,true)

    registerIntegrationTestTask(tasks, "testVAES8", "LTS_JDK8", 8, "1.8", "vaes", "auto", ignoreIntel,true)
    registerIntegrationTestTask(tasks, "testVAES21", "LTS_JDK21", 21, "21", "vaes", "auto", ignoreIntel,true)

    registerIntegrationTestTask(tasks, "testVAESF8", "LTS_JDK8", 8, "1.8", "vaesf", "auto", ignoreIntel,true)
    registerIntegrationTestTask(tasks, "testVAESF21", "LTS_JDK21", 21, "21", "vaesf", "auto", ignoreIntel,true)



    tasks.register("testAVX") {
        for (String name in tasks.findAll { it.name.contains("AVX") }) {
            String n = name.substring(name.lastIndexOf(':') + 1).replace("'", "");
            if (n.equals("testAVX")) {
                continue
            }
            dependsOn(n);
        }
    }

    tasks.register("testVAES") {
        for (String name in tasks.findAll { it.name.contains("VAES") && !it.name.contains("VAESF") }) {
            String n = name.substring(name.lastIndexOf(':') + 1).replace("'", "");
            if (n.equals("testVAES")) {
                continue
            }
            dependsOn(n);
        }
    }

    tasks.register("testVAESF") {
        for (String name in tasks.findAll { it.name.contains("VAESF") }) {
            String n = name.substring(name.lastIndexOf(':') + 1).replace("'", "");
            if (n.equals("testVAESF")) {
                continue
            }
            dependsOn(n);
        }
    }

    tasks.register("testNEON") {
        doLast() {
            println("testNEON not available on this platform!");
        }
    }

    tasks.register("testNative") {
        dependsOn("testAVX");
        dependsOn("testVAES");
        dependsOn("testVAESF");
    }

} else {
    println("Unrecognised architecture ${arch_}, no native tests added.")
}
