import static ExtraFunctions.*

plugins {
    id "biz.aQute.bnd.builder" version "7.0.0"
}
apply plugin: 'maven-publish'

jar.archiveBaseName = "bcmail-lts${vm_range}"

sourceSets {
    java9 {
        java {
            srcDirs = ['src/main/jdk1.9']
        }
    }
}

configurations {
    mailModulePath
}

dependencies {
    implementation project(':prov')
    implementation project(':util')
    implementation project(':pkix')

    implementation group: 'javax.mail', name: 'mail', version: '1.4'
    // javax.mail:mail:1.4 pulls in javax.activation:activation:1.1 transitively - both are
    // needed as automatic modules ("mail", "activation") on the module-info.java compile path,
    // since neither javax.mail nor javax.activation is a JDK-bundled module on Java 11+.
    mailModulePath group: 'javax.mail', name: 'mail', version: '1.4'
    implementation files("$lts_prov")
    implementation files("$lts_util")
    implementation files("$lts_pkix")
    implementation project(path: ':core')

    java9Implementation project(':prov')
    java9Implementation project(':util')
    java9Implementation project(':pkix')
    java9Implementation files(sourceSets.main.output.classesDirs) {
        builtBy compileJava
    }

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.14.3'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.14.3'
    // Source: https://mvnrepository.com/artifact/org.junit.vintage/junit-vintage-engine
    testImplementation("org.junit.vintage:junit-vintage-engine:5.14.3")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testRuntimeOnly(files(jar.archiveFile))
}

compileJava {
    options.release = 8
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
    dependsOn(':pkix:jar')

}

// module-info.java declares its javax.mail/javax.activation dependences under all four names
// those libraries are known by (see the comment there), so all four have to be observable when
// it is compiled. Only one generation can be supplied for real: mail-1.4.jar ("mail") and
// javax.mail-1.6.2.jar ("java.mail") both contain the javax.mail package, and two automatic
// modules exporting the same package to us is a resolution error. So the 1.4.x pair is the real
// one - matching what the main sources compile against - and the "java.*" names are supplied as
// empty stub modules, named only by their file names. They carry no classes, exist purely so the
// optional requires resolve at compile time, and are neither needed nor shipped at run time.
task moduleNameStubJars {
    ext.stubDir = layout.buildDirectory.dir("module-name-stubs").get().asFile
}

['java.mail', 'java.activation'].each { stubName ->
    def stubTask = tasks.register("stubJar_${stubName.replace('.', '_')}", Jar) {
        archiveFileName = "${stubName}.jar"
        destinationDirectory = moduleNameStubJars.stubDir
    }
    moduleNameStubJars.dependsOn stubTask
}

compileJava9Java {
    dependsOn moduleNameStubJars

    // Deliberately source/targetCompatibility rather than options.release = 9: under --release 9
    // java.activation is a real (since-removed) platform module exporting javax.activation, which
    // collides with the activation automatic module the same descriptor requires. Compiling against
    // the current platform leaves the name to the stub jar. Safe here because this source set is
    // module-info.java alone - no platform API is compiled against.
    sourceCompatibility = 9
    targetCompatibility = 9

    options.compilerArgs += [
            '--module-path', "$lts_prov:$lts_util:$lts_pkix:${configurations.mailModulePath.asPath}:${moduleNameStubJars.stubDir}"
    ]
    options.sourcepath = files(['src/main/java', 'src/main/jdk1.9'])
    options.compilerArgs << '-implicit:none'  // avoid recompiling every baseline class implicitly loaded via sourcepath
}

jar {
    from sourceSets.main.output
    into('META-INF/versions/9') {
        from sourceSets.java9.output
    }
    String v = "${rootProject.extensions.ext.bundle_version}"
    manifest.attributes('Multi-Release': 'true')
    manifest.attributes('Bundle-Name': 'bcmail')
    manifest.attributes('Bundle-SymbolicName': 'bcmail')
    manifest.attributes('Bundle-RequiredExecutionEnvironment': 'JavaSE-1.8')
    manifest.attributes('Export-Package': "org.bouncycastle.mail.*;version=${v}")
    manifest.attributes('Import-Package': "java.*;resolution:=optional,javax.*;resolution:=optional,!org.bouncycastle.mail.*,org.bouncycastle.*;version=\"[${v},${maxVersion})\"")
    manifest.attributes('Bundle-Version': "${v}")
    manifest.attributes('Permissions': 'all-permissions')
    manifest.attributes('Codebase': '*')
    manifest.attributes('Application-Library-Allowable-Codebase': '*')
    manifest.attributes('Caller-Allowable-Codebase': '*')
    manifest.attributes('Trusted-Library': 'true')
}

task sourcesJar(type: Jar) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    into('META-INF/versions/9') {
        from sourceSets.java9.allSource
    }
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
    dependsOn(':pkix:jar')
}

javadoc {
    title = "Bouncy Castle Library (LTS Edition) ${version} JavaMail API"
    options.windowTitle = "Bouncy Castle Library (LTS Edition) ${version} JavaMail API"
    options.overview = "overview.html"
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
    dependsOn(':pkix:jar')

}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveBaseName = jar.archiveBaseName
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.bouncycastle'
            artifactId = "bcmail-lts$vm_range"
            from components.java
    
            artifact(javadocJar)
            artifact(sourcesJar)
        }
    
    }
}

artifacts {
    archives jar
    archives javadocJar
    archives sourcesJar
}

task('copyJars', type: Copy) {
    dependsOn("jar")
    dependsOn("sourcesJar")
    dependsOn("javadocJar")

    from new File(projectDir, "build/libs")
    into new File(rootDir, "../bc-lts-java-jars/${version}/")
}

checkstyleMain {
    dependsOn(':prov:jar')
    dependsOn(':util:jar')
    dependsOn(':pkix:jar')
}

compileTestJava {
    dependsOn(":prov:jar")
    dependsOn(":util:jar")
    dependsOn(":pkix:jar")
}

//
// Unit tests run in parallel
//
def registerUnitTestTask(TaskContainer taskContainer, String taskName, String expectEnvVar, int jvmVersion) {

    taskContainer.register("${taskName}Unit", Test) {
        onlyIf { System.getenv(expectEnvVar) != null }
        failOnNoDiscoveredTests = true
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(jvmVersion)
        }

        useJUnitPlatform()
        testLogging.showStandardStreams = true
        testLogging.showCauses = true
        testLogging.showExceptions = true
        testLogging.showStackTraces = true

        minHeapSize = "4096m"
        maxHeapSize = "8192m"

        maxParallelForks = Math.min(1, Runtime.getRuntime().availableProcessors() - 1);
        forkEvery = 1

        filter {
            includeTestsMatching "*AllTest*"
        }

        def args = new ArrayList<String>();
        args.add("-Dtest.bclts.expected_jvm=any")
        args.add("-Dorg.bouncycastle.bks.enable_v1=true")

        classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
        testClassesDirs = project.sourceSets.test.output.classesDirs

        jvmArgs args
    }

}



test {


    testLogging.showStandardStreams = true
    testLogging.showCauses = true
    testLogging.showExceptions = true
    testLogging.showStackTraces = true

    failOnNoDiscoveredTests = true
    useJUnitPlatform()

    minHeapSize = "4096m"
    maxHeapSize = "8192m"

    classpath = project.sourceSets.test.output + configurations.testRuntimeClasspath + files(jar.archiveFile)
    testClassesDirs = project.sourceSets.test.output.classesDirs

    maxParallelForks = Math.min(1, Runtime.getRuntime().availableProcessors() - 1);
    forkEvery = 1

    filter {
        includeTestsMatching "*AllTest*"
    }

    def args = new ArrayList<String>();
    args.add("-Dtest.bclts.expected_jvm=any")
    args.add("-Dorg.bouncycastle.bks.enable_v1=true")

    jvmArgs args
}

tasks.register("testMultiJVM") {
    dependsOn("test8Unit")
    dependsOn("test21Unit")
}

registerUnitTestTask(tasks, "test8", "LTS_JDK8", 8,)
registerUnitTestTask(tasks, "test21", "LTS_JDK21", 21)
